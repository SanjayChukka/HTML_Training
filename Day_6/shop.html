<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .header {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-around;
        gap: 24px;
        padding: 16px 24px;
        /* border: 10px ; */
        box-shadow: 0 4px 16px;
      }

      .loot {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: rgb(0, 0, 0);
        background-color: rgb(81, 220, 71);
        box-shadow: 0 4px 16px rgb(81, 220, 71);
        /* padding: 12px 20px; */
        border-radius: 10px;
        font-weight: bold;
        padding: 16px 24px;
      }

      .search-box {
        flex: 1;
        max-width: 500px;
        /* border: 1px greenyellow; */
        /* border-radius: 10px; */
      }

      .search-box img {
        width: 20px;
        height: 20px;
      }

      /* Show dropdown options when hovering */
      .right-corner .dropdown:hover > .dropdown-menu {
        display: block;
        margin-top: 0;
      }

      /* Keep dropdown options visible while moving the mouse into them */
      .right-corner .dropdown-menu {
        margin-top: 0;
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgb(81, 220, 71);
        padding: 8px 0;
        min-width: 220px;
      }

      /* Highlight dropdown items on hover */
      .right-corner .dropdown-item:hover {
        background-color: rgb(81, 220, 71);
        color: black;
      }

      /* Search bar hover and focus highlight */
      .search-box {
        border-radius: 8px;
        transition: box-shadow 0.2s ease;
      }

      .search-box:hover,
      .search-box:focus-within {
        box-shadow: 0 0 0 3px rgba(13, 202, 240, 0.3);
      }

      .search-box .form-control:focus {
        border-color: #86d7f5;
        box-shadow: none;
      }

      .search-box .btn:hover {
        background-color: #e7f3ff;
        border-color: #86d7f5;
        color: #0d6efd;
      }

      .right-corner {
        /* background-color: black; */
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .cart a {
        display: flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }
      .right-corner button {
        background-color: aliceblue;
        color: black;
      }
    </style>
    <title>Loot Karo</title>
  </head>
  <body>
    <!-- Header Part -->
    <header class="header">
      <!-- Company -->
      <div class="loot">
        <span id="loot">Loot Karo</span>
      </div>

      <!-- Search bar -->
      <div class="input-group search-box">
        <button
          class="btn btn-outline-secondary"
          type="button"
          id="button-addon"
          aria-label="Search"
        >
          <img src="./search.svg" alt="" />
        </button>

        <input
          id="search"
          type="search"
          class="form-control"
          placeholder="Search for Products, Brands..."
          aria-label="Search for products and brands"
          aria-describedby="button-addon"
        />
      </div>

      <!-- Login, Menu and Cart -->
      <div class="right-corner">
        <!-- Login -->
        <div class="dropdown">
          <button
            class="btn btn-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <img src="./person-circle.svg" alt="person" />
            <span>Login</span>
          </button>

          <ul class="dropdown-menu">
            <li>
              <h6 class="dropdown-header">
                New customer? <a href="#">Sign Up</a>
              </h6>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li><a class="dropdown-item" href="#">My Profile</a></li>
            <li><a class="dropdown-item" href="#">Flipkart Plus Zone</a></li>
            <li><a class="dropdown-item" href="#">Orders</a></li>
            <li><a class="dropdown-item" href="#">Wishlist</a></li>
            <li><a class="dropdown-item" href="#">Rewards</a></li>
            <li><a class="dropdown-item" href="#">Gift Cards</a></li>
            <li>
              <a class="dropdown-item" href="#">Notification Preferences</a>
            </li>
          </ul>
        </div>

        <!-- Menu -->
        <div class="dropdown">
          <button
            class="btn btn-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <span>Menu</span>
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Become a Seller</a></li>
            <li><a class="dropdown-item" href="#">24x7 Customer Care</a></li>
            <li><a class="dropdown-item" href="#">Advertise</a></li>
            <li><a class="dropdown-item" href="#">Download App</a></li>
          </ul>
        </div>

        <!-- Cart -->
        <div class="cart"
        style="background-color: greenyellow;">
          <a href="#">
            <img src="./cart3.svg" alt="cart" />
            <!-- <span>Cart</span> -->
          </a>
        </div>
      </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
