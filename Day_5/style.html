<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cascading Style Sheet</title>
    <style>
        *{
            box-sizing: border-box;
        }
        h1{
            background-color: antiquewhite;
            color: maroon;
        }
        p{
            background-color: bisque;
            color: darkgray;
        }
        button{
            background-color: aqua;
            color: black;
        }
        
    </style>
  </head>
  <body>
    <h1 id="title">My Portfolio</h1>
    <p class="intro">Welcome to my website.</p>
    <p class="intro">I build software projects.</p>
    <button>View Projects</button>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        * {
            box-sizing: border-box;
        }

        .box {
            width: 300px;
            height: 150px;
            padding: 20px;
            border: 3px solid maroon;
            background-color: lightblue;
            margin: 25px;
        }
    </style>
</head>
<body>
    <div class="box">CSS Box Model</div>
</body>
</html>
